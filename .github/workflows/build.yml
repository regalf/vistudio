name: Build and Release

on:
  push:
    branches: [master, gpu-acceleration-test]
    tags: ['v*']
  pull_request:
    branches: [master, gpu-acceleration-test]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag per nuovi rilasci (es. v0.10.0)'
        required: false
      silent:
        description: "Silent update — sostituisce gli asset dell'ultima release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  build-linux:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add GPU experimental suffix on gpu branch
        if: github.ref_name == 'gpu-acceleration-test'
        run: node -e "const p=require('./package.json'); p.version+='-gpu-experimental'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Build project
        run: npm run build

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml
          retention-days: 30

  build-windows:
    needs: lint
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref_name == 'gpu-acceleration-test' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Add GPU experimental suffix on gpu branch
        if: github.ref_name == 'gpu-acceleration-test'
        run: node -e "const p=require('./package.json'); p.version+='-gpu-experimental'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Build project
        run: npm run build

      - name: Build Windows portable
        run: npx electron-builder --win portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-windows
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 30

  release:
    needs: build-linux
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref_name == 'gpu-acceleration-test' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Determine release tag
        id: target
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${GITHUB_REF_NAME}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Silent input: '${{ github.event.inputs.silent }}'"

          BRANCH="${{ github.ref_name }}"
          IS_GPU=false
          if [[ "$BRANCH" == "gpu-acceleration-test" ]]; then IS_GPU=true; fi

          # Determine tag
          if [[ "${{ github.event_name }}" == "push" && "$IS_GPU" == "true" && ! "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            echo "GPU branch push — creating/updating gpu-experimental release"
            VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
            TAG="v${VERSION}-gpu-experimental"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.silent }}" == "true" ]]; then
            echo "Silent mode: finding latest release..."
            if [[ "$IS_GPU" == "true" ]]; then
              TAG=$(gh release list --limit 5 --json tagName --jq '.[].tagName' 2>/dev/null | grep -i gpu-experimental | head -1) || TAG=""
            else
              TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null) || TAG=""
            fi
            echo "Latest tag: '$TAG'"
            if [[ -z "$TAG" ]]; then
              echo "No release found. Falling back to version from package.json..."
              VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
              TAG="v${VERSION}"
              if [[ "$IS_GPU" == "true" ]]; then TAG="${TAG}-gpu-experimental"; fi
            fi
            echo "Updating latest release: $TAG"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update release
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          echo "Target tag: $TAG"

          # Create release if it doesn't exist
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Creating new release $TAG"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

          # Upload assets (handle path with find in case of dir nesting)
          echo "Uploading AppImage..."
          find . -name '*.AppImage' -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Uploading Windows exe..."
          find . -name '*.exe' -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Uploading latest.yml..."
          find . -name 'latest*.yml' -not -name 'builder-debug*' -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Done"
        env:
          GH_TOKEN: ${{ github.token }}
