name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag per nuovi rilasci (es. v1.1.0)'
        required: false
      silent:
        description: "Silent update — sostituisce gli asset dell'ultima release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  build-linux:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install system deps for deb/rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build Linux targets (AppImage, deb, rpm, tar.gz)
        run: npx electron-builder --linux AppImage deb rpm tar.gz --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest-linux.yml
          retention-days: 30

  build-windows:
    needs: lint
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install wine for Windows cross-build
        run: sudo apt-get install -y -qq wine64

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build Windows portable + NSIS installer
        run: npx electron-builder --win portable nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest-windows.yml (auto-update metadata)
        run: |
          EXE=$(ls release/*.exe 2>/dev/null | head -1)
          if [[ -z "$EXE" ]]; then
            echo "No .exe found, skipping metadata"
            exit 0
          fi
          echo "Generating metadata for: $EXE"
          SHA512=$(openssl dgst -sha512 -binary "$EXE" | base64 -w0)
          SIZE=$(stat -c%s "$EXE")
          VERSION=$(node -e "console.log(require('./package.json').version)")
          {
            echo "version: $VERSION"
            echo "files:"
            echo "  - url: $(basename "$EXE")"
            echo "    sha512: $SHA512"
            echo "    size: $SIZE"
            echo "path: $(basename "$EXE")"
            echo "sha512: $SHA512"
            echo "releaseDate: $(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          } > release/latest-windows.yml
          cat release/latest-windows.yml

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest-*.yml
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Determine release tag
        id: target
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${GITHUB_REF_NAME}"
          echo "Silent input: '${{ github.event.inputs.silent }}'"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.silent }}" == "true" ]]; then
            echo "Silent mode: finding latest release..."
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null) || TAG=""
            echo "Latest tag: '$TAG'"
            if [[ -z "$TAG" ]]; then
              echo "No release found. Falling back to version from package.json..."
              VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
              TAG="v${VERSION}"
            fi
            echo "Updating latest release: $TAG"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch (no tag, no silent) — creating release from package.json"
            VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update release
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          echo "Target tag: $TAG"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Creating new release $TAG"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

          echo "Uploading Linux artifacts..."
          find . \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) \
            -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Uploading Windows artifacts..."
          find . -name '*.exe' -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Uploading auto-update metadata..."
          find . -name 'latest*.yml' -not -name 'builder-debug*' \
            -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Done"
        env:
          GH_TOKEN: ${{ github.token }}
