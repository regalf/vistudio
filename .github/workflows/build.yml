name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag per nuovi rilasci (es. v0.10.0)'
        required: false
      silent:
        description: "Silent update — sostituisce gli asset dell'ultima release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build executable
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-AppImage
          path: release/*.AppImage
          retention-days: 30

      - name: Upload latest.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-latest-yml
          path: release/latest.yml
          retention-days: 30

  release:
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Determine release tag
        id: target
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${GITHUB_REF_NAME}"
          echo "Silent input: '${{ github.event.inputs.silent }}'"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.silent }}" == "true" ]]; then
            echo "Silent mode: finding latest release..."
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null) || TAG=""
            echo "Latest tag: '$TAG'"
            if [[ -z "$TAG" ]]; then
              echo "No release found. Skipping upload."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Updating latest release: $TAG"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update release
        if: steps.target.outputs.skip != 'true'
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          echo "Target tag: $TAG"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release $TAG already exists — uploading assets with clobber"
            gh release upload "$TAG" vistudio-AppImage/*.AppImage vistudio-latest-yml/latest.yml --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" \
              vistudio-AppImage/*.AppImage \
              vistudio-latest-yml/latest.yml \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
