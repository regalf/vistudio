name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag per nuovi rilasci (es. v0.11.0)'
        required: false
      silent:
        description: "Silent update — sostituisce gli asset dell'ultima release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  build-linux:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml
          retention-days: 30

  build-windows:
    needs: lint
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build Windows (portable + installer for auto-update metadata)
        run: npx electron-builder --win portable --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Windows latest.yml → latest-windows.yml
        run: |
          echo "=== release/ contents ==="
          find release/ -type f
          if [ -f release/latest.yml ]; then
            mv release/latest.yml release/latest-windows.yml
            echo "Renamed latest.yml → latest-windows.yml"
          else
            echo "WARNING: latest.yml not generated"
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-windows
          path: |
            release/*.exe
            release/latest-*.yml
          retention-days: 30

  release:
    needs: [build-linux, build-windows]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Determine release tag
        id: target
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${GITHUB_REF_NAME}"
          echo "Silent input: '${{ github.event.inputs.silent }}'"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.silent }}" == "true" ]]; then
            echo "Silent mode: finding latest release..."
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null) || TAG=""
            echo "Latest tag: '$TAG'"
            if [[ -z "$TAG" ]]; then
              echo "No release found. Falling back to version from package.json..."
              VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
              TAG="v${VERSION}"
            fi
            echo "Updating latest release: $TAG"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch (no tag, no silent) — creating release from package.json"
            VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update release
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          echo "Target tag: $TAG"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Creating new release $TAG"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

          echo "Uploading AppImage..."
          find . -name '*.AppImage' -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Uploading Windows exe..."
          find . -name '*.exe' -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Uploading latest*.yml (auto-update metadata)..."
          find . -name 'latest*.yml' -not -name 'builder-debug*' -exec gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY" \;

          echo "Done"
        env:
          GH_TOKEN: ${{ github.token }}
