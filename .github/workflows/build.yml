name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build executable
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-AppImage
          path: release/*.AppImage
          retention-days: 30

      - name: Upload latest.yml (auto-update metadata)
        uses: actions/upload-artifact@v4
        with:
          name: vistudio-latest-yml
          path: release/latest.yml
          retention-days: 30

      - name: Silent replace assets in latest release (master push only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$TAG" ]; then
            echo "Replacing assets in latest release: $TAG"
            gh release upload "$TAG" release/*.AppImage --clobber
            gh release upload "$TAG" release/latest.yml --clobber
            echo "Done - binary replaced in existing release $TAG"
          else
            echo "No existing release found - skipping silent replace"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vistudio-AppImage/*.AppImage
            vistudio-latest-yml/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
